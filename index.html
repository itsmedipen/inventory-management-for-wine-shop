<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4c1d95" />
  <title>Wine Cellar POS — Nepal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --brand: #4c1d95;
      --brand-2: #7c3aed;
      --gold: #f59e0b;
      --ink: #0f172a;
      --bg: #f8fafc;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .brand-grad {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-active {
      color: var(--brand-2);
    }

    .nav-active svg {
      stroke: var(--brand-2);
    }

    input,
    select,
    textarea {
      font-size: 16px;
    }

    .scroll-area {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 600;
    }

    .skel {
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: sk 1.2s infinite;
    }

    @keyframes sk {
      0% {
        background-position: 200% 0
      }

      100% {
        background-position: -200% 0
      }
    }

    .toast {
      animation: slideUp .25s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    .modal-bd {
      animation: fade .2s ease;
    }

    @keyframes fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .sheet {
      animation: sheet .25s ease;
    }

    @keyframes sheet {
      from {
        transform: translateY(100%)
      }

      to {
        transform: translateY(0)
      }
    }

    .receipt-paper {
      background: #fff;
      background-image: repeating-linear-gradient(transparent 0 27px, #f3f4f6 27px 28px);
    }

    @media print {
      body * {
        visibility: hidden !important;
      }

      #print-area,
      #print-area * {
        visibility: visible !important;
      }

      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .no-print {
        display: none !important;
      }
    }

    .pulse-dot {
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .5
      }

      50% {
        opacity: 1
      }
    }

    .ring-brand:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, .25);
      border-color: var(--brand-2);
    }

    button {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    button:active {
      transform: scale(.96);
    }
  </style>
</head>

<body class="select-none">

  <!-- ============== APP ROOT ============== -->
  <div id="app" class="min-h-screen max-w-[480px] mx-auto bg-stone-100 relative pb-20"></div>

  <!-- ============== TOAST STACK ============== -->
  <div id="toasts"
    class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 items-center pointer-events-none">
  </div>

  <!-- ============== MODAL ROOT ============== -->
  <div id="modal-root"></div>

  <script>
    /* ====================================================================
       WINE CELLAR POS — NEPALI WINE SHOP INVENTORY & POS
       Single-file demo app (mobile-first PWA-style)
       Persistence: localStorage  |  Currency: NPR (रू)
       ==================================================================== */

    /* ---------- UTILITIES ---------- */
    const $ = (s, p = document) => p.querySelector(s);
    const $$ = (s, p = document) => [...p.querySelectorAll(s)];
    const uid = (p = 'id') => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
    const fmtNPR = n => 'रू ' + (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtInt = n => (Number(n) || 0).toLocaleString('en-IN');
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const nowISO = () => new Date().toISOString();
    const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
    const fmtTime = iso => { const d = new Date(iso); return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    const toast = (msg, type = 'success') => {
      const el = document.createElement('div');
      const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-stone-800', warn: 'bg-amber-600' };
      el.className = `toast ${colors[type] || colors.info} text-white px-4 py-2.5 rounded-full text-sm font-medium shadow-lg pointer-events-auto max-w-[90vw]`;
      el.textContent = msg;
      $('#toasts').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2400);
    };

    /* ---------- DATA STORE ---------- */
    const STORE_KEY = 'wineshop_pos_v1';
    const DEFAULTS = {
      shop: { name: 'Vajrapani Liquor Trade', address: 'Boudha, Kathmandu', phone: '+977-9841-XXXXXX', vat: '601234567', currency: 'NPR' },
      users: [
        { id: 'u_owner', email: 'owner@wineshop.com', pin: '1234', name: 'Dipen Sherpa', role: 'owner' },
        { id: 'u_cashier', email: 'cashier@wineshop.com', pin: '0000', name: 'Cashier', role: 'cashier' }
      ],
      products: [],
      sales: [],
      purchases: [],
      expenses: [],
      audit: [],
      settings: { lowStockThreshold: 5, taxRate: 0, qrPaymentLabel: 'Fonepay / eSewa / Khalti' }
    };

    const seedProducts = () => ([
      { id: uid('p'), name: 'Khukri Rum 750ml', category: 'Rum', barcode: '8901234500011', price: 1450, cost: 1100, stock: 24, lowStock: 5, brand: 'Khukri', unit: '750ml' },
      { id: uid('p'), name: 'Ruslan Vodka 750ml', category: 'Vodka', barcode: '8901234500028', price: 1200, cost: 900, stock: 18, lowStock: 5, brand: 'Ruslan', unit: '750ml' },
      { id: uid('p'), name: '8848 Vodka 1L', category: 'Vodka', barcode: '8901234500035', price: 2100, cost: 1650, stock: 12, lowStock: 4, brand: '8848', unit: '1000ml' },
      { id: uid('p'), name: 'Nepal Ice Strong 650ml', category: 'Beer', barcode: '8901234500042', price: 380, cost: 290, stock: 48, lowStock: 12, brand: 'Nepal Ice', unit: '650ml' },
      { id: uid('p'), name: 'Tuborg Premium 500ml', category: 'Beer', barcode: '8901234500059', price: 340, cost: 260, stock: 60, lowStock: 12, brand: 'Tuborg', unit: '500ml' },

      { id: uid('p'), name: 'Old Durbar Whisky 750ml', category: 'Whisky', barcode: '8901234500080', price: 2800, cost: 2200, stock: 14, lowStock: 4, brand: 'Old Durbar', unit: '750ml' },

    ]);

    const seedSales = (products) => {
      const sales = [];
      const now = Date.now();
      for (let d = 0; d < 7; d++) {
        const day = now - d * 86400000;
        const txCount = 3 + Math.floor(Math.random() * 5);
        for (let t = 0; t < txCount; t++) {
          const items = [];
          const itemCount = 1 + Math.floor(Math.random() * 4);
          const used = new Set();
          for (let i = 0; i < itemCount; i++) {
            let p = products[Math.floor(Math.random() * products.length)];
            if (used.has(p.id)) continue; used.add(p.id);
            const qty = 1 + Math.floor(Math.random() * 3);
            items.push({ productId: p.id, name: p.name, price: p.price, cost: p.cost, qty });
          }
          const subtotal = items.reduce((s, i) => s + i.price * i.qty, 0);
          const cost = items.reduce((s, i) => s + i.cost * i.qty, 0);
          const ts = new Date(day - Math.floor(Math.random() * 36000000)).toISOString();
          sales.push({
            id: uid('s'),
            invoice: 'INV-' + String(1000 + sales.length + 1),
            items, subtotal, discount: 0, tax: 0, total: subtotal,
            cost, profit: subtotal - cost,
            payment: Math.random() > 0.5 ? 'cash' : 'qr',
            cashier: 'Dipen Sherpa',
            customer: 'Walk-in',
            ts
          });
        }
      }
      return sales;
    };

    const Store = {
      load() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) { }
        const data = JSON.parse(JSON.stringify(DEFAULTS));
        data.products = seedProducts();
        data.sales = seedSales(data.products);
        // adjust stock down based on seeded sales
        data.sales.forEach(s => s.items.forEach(i => {
          const p = data.products.find(p => p.id === i.productId);
          if (p) p.stock = Math.max(0, p.stock - i.qty);
        }));
        data.audit.push({ id: uid('a'), ts: nowISO(), user: 'system', action: 'seed', detail: 'Demo data initialized' });
        Store.save(data);
        return data;
      },
      save(d = state) { localStorage.setItem(STORE_KEY, JSON.stringify(d)); },
      reset() { localStorage.removeItem(STORE_KEY); }
    };

    /* ---------- APP STATE ---------- */
    let state = Store.load();
    state.expenses = state.expenses || [];
    let session = JSON.parse(sessionStorage.getItem('ws_session') || 'null');
    let route = location.hash.replace('#', '') || (session ? 'home' : 'login');
    let cart = JSON.parse(sessionStorage.getItem('ws_cart') || '[]');
    let scanner = null;
    let scannerCtx = 'pos'; // 'pos' | 'products'

    const setSession = (u) => { session = u; if (u) sessionStorage.setItem('ws_session', JSON.stringify(u)); else sessionStorage.removeItem('ws_session'); };
    const setCart = (c) => { cart = c; sessionStorage.setItem('ws_cart', JSON.stringify(c)); };
    const goto = (r) => { location.hash = r; };

    window.addEventListener('hashchange', () => {
      route = location.hash.replace('#', '') || 'home';
      render();
    });

    /* ---------- AUDIT ---------- */
    const audit = (action, detail) => {
      state.audit.unshift({ id: uid('a'), ts: nowISO(), user: session?.name || 'system', role: session?.role || 'system', action, detail });
      if (state.audit.length > 500) state.audit.length = 500;
      Store.save();
    };

    /* ====================================================================
       ROUTES — render() picks correct screen
       ==================================================================== */
    function render() {
      if (!session) { if (route !== 'login') location.hash = 'login'; return renderLogin(); }
      switch (route) {
        case 'home': return renderHome();
        case 'pos': return renderPOS();
        case 'products': return renderProducts();
        case 'reports': return renderReports();
        case 'more': return renderMore();
        case 'product-new': return renderProductForm();
        case 'product-edit': return renderProductForm(sessionStorage.getItem('ws_edit_pid'));
        case 'checkout': return renderCheckout();
        case 'sales': return renderSalesHistory();
        case 'expenses': return renderExpenses();
        case 'expense-new': return renderExpenseForm();
        case 'stock-add': return renderStockAdd();
        case 'purchases': return renderPurchases();
        case 'purchase-new': return renderPurchaseForm();
        case 'audit': return renderAudit();
        case 'settings': return renderSettings();
        case 'login': return renderLogin();
        default:
          if (route.startsWith('receipt/')) return renderReceipt(route.split('/')[1]);
          if (route.startsWith('product/')) return renderProductDetail(route.split('/')[1]);
          return renderHome();
      }
    }

      // categories chips
      const cats = ['All', ...new Set(state.products.map(p => p.category))];
      let activeCat = 'All';
      const renderCats = () => {
        $('#pos-cats').innerHTML = cats.map(c =>
          `<button data-cat="${c}" class="cat-chip flex-shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold ${c === activeCat ? 'bg-stone-900 text-white' : 'bg-white text-stone-600 border border-stone-200'}">${c}</button>`
        ).join('');
        $$('.cat-chip').forEach(b => b.onclick = () => { activeCat = b.dataset.cat; renderCats(); renderGrid(); });
      };
      const renderGrid = () => {
        const q = $('#pos-search').value.trim().toLowerCase();
        const list = state.products.filter(p => {
          const okCat = activeCat === 'All' || p.category === activeCat;
          const okQ = !q || p.name.toLowerCase().includes(q) || p.barcode.includes(q) || p.brand.toLowerCase().includes(q);
          return okCat && okQ;
        });
        $('#pos-grid').innerHTML = list.length === 0
          ? `<div class="col-span-2 py-10 text-center text-stone-500 text-sm">No products. <button onclick="goto('product-new')" class="text-red-700 font-semibold underline">Add new</button></div>`
          : list.map(p => `
        <button onclick="addToCart('${p.id}')" class="card p-3 text-left active:scale-95 transition ${p.stock <= 0 ? 'opacity-50' : ''}" ${p.stock <= 0 ? 'disabled' : ''}>
          <div class="aspect-square rounded-lg brand-grad/10 mb-2 flex items-center justify-center text-3xl bg-gradient-to-br from-purple-50 to-indigo-50">
            ${categoryEmoji(p.category)}
          </div>
          <div class="text-[11px] text-stone-500 uppercase tracking-wide">${p.category}</div>
          <div class="text-sm font-semibold leading-tight mt-0.5 line-clamp-2 h-9">${p.name}</div>
          <div class="flex items-center justify-between mt-1.5">
            <div class="text-sm font-bold text-red-700">${fmtNPR(p.price)}</div>
            <div class="text-[10px] ${p.stock <= p.lowStock ? 'text-amber-600' : 'text-stone-500'} font-medium">${p.stock} left</div>
          </div>
        </button>`).join('');
      };
      renderCats(); renderGrid();
      $('#pos-search').addEventListener('input', renderGrid);
      $('#pos-search').addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          const v = e.target.value.trim();
          const p = state.products.find(p => p.barcode === v);
          if (p) { addToCart(p.id); e.target.value = ''; renderGrid(); }
        }
      });
    }

    function categoryEmoji(c) {
      return ({ 'Soft Drink': '🥤', 'Hard Drink': '🍶', 'Cigarette': '🚬', 'Vape': '💨', 'Others': '🛍️' }[c] || '🛍️');
    }

    function addToCart(pid) {
      const p = state.products.find(p => p.id === pid);
      if (!p) return;
      if (p.stock <= 0) { toast('Out of stock', 'warn'); return; }
      const existing = cart.find(c => c.productId === pid);
      if (existing) {
        if (existing.qty + 1 > p.stock) { toast('Not enough stock', 'warn'); return; }
        existing.qty++;
      } else {
        cart.push({ productId: p.id, name: p.name, price: p.price, cost: p.cost, qty: 1 });
      }
      setCart(cart);
      toast(`Added ${p.name}`, 'success');
      if (route === 'pos') renderPOS();
    }

    function generateQRBlocks() {
      // Decorative pseudo QR – not a real payment QR
      const cells = 21; const size = 100 / cells;
      let svg = '';
      // 3 finder patterns
      const finder = (x, y) => `
    <rect x="${x}" y="${y}" width="${size * 7}" height="${size * 7}" fill="black"/>
    <rect x="${x + size}" y="${y + size}" width="${size * 5}" height="${size * 5}" fill="white"/>
    <rect x="${x + size * 2}" y="${y + size * 2}" width="${size * 3}" height="${size * 3}" fill="black"/>`;
      svg += finder(0, 0) + finder(size * 14, 0) + finder(0, size * 14);
      // random data dots
      let seed = 42;
      for (let r = 0; r < cells; r++) {
        for (let c = 0; c < cells; c++) {
          // skip finder regions
          if ((r < 7 && c < 7) || (r < 7 && c >= 14) || (r >= 14 && c < 7)) continue;
          seed = (seed * 9301 + 49297) % 233280;
          if ((seed / 233280) > 0.55) {
            svg += `<rect x="${c * size}" y="${r * size}" width="${size}" height="${size}" fill="black"/>`;
          }
        }
      }
      return svg;
    }

            : range === 'week' ? now - 7 * 86400000

          expenses = state.expenses.filter(e => new Date(e.ts).getTime() >= cutoff);
        }
        const expTotal = expenses.reduce((a, e) => a + e.amount, 0);
        const revenue = sales.reduce((a, s) => a + s.total, 0);

      </div>

        setTimeout(() => {

            type: 'line',
            data: { labels, datasets: [{ data: series, borderColor: '#7c1d1d', backgroundColor: 'rgba(124,29,29,0.08)', fill: true, tension: 0.35, pointRadius: 2, borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => 'रू ' + v }, grid: { color: '#f5f5f4' } }, x: { grid: { display: false } } } }

    function exportCSV() {
      const rows = [['Invoice', 'Date', 'Time', 'Cashier', 'Customer', 'Items', 'Subtotal', 'Discount', 'Tax', 'Total', 'Cost', 'Profit', 'Payment']];
      state.sales.forEach(s => {
        rows.push([
          s.invoice, fmtDate(s.ts), fmtTime(s.ts), s.cashier, s.customer,
          s.items.map(i => `${i.name}x${i.qty}`).join(' | '),
          s.subtotal, s.discount, s.tax, s.total, s.cost, s.profit, s.payment
        ]);
      });
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `sales_${todayISO()}.csv`; a.click();
      URL.revokeObjectURL(url);
      toast('CSV exported', 'success');
    }

      window.addPuLine = () => {
        lines.push({ productId: '', qty: 1, cost: 0 });
        redrawLines();
      };
      window.removePuLine = (i) => { lines.splice(i, 1); redrawLines(); };
      window.savePurchase = () => {
        const supplier = $('#pu-supplier').value.trim();
        const bill = $('#pu-bill').value.trim();
        if (!supplier) { toast('Supplier required', 'error'); return; }
        if (lines.length === 0) { toast('Add at least 1 item', 'error'); return; }
        const items = lines.map(l => {
          const p = state.products.find(p => p.id === l.productId);
          return { productId: l.productId, name: p?.name || '?', qty: Number(l.qty) || 0, cost: Number(l.cost) || 0 };
        }).filter(i => i.productId && i.qty > 0);
        if (items.length === 0) { toast('Invalid lines', 'error'); return; }
        const total = items.reduce((a, i) => a + i.cost * i.qty, 0);
        const purchase = { id: uid('pu'), supplier, bill, items, total, ts: nowISO(), user: session.name };
        state.purchases.push(purchase);
        items.forEach(i => {
          const p = state.products.find(p => p.id === i.productId);
          if (p) {
            p.stock += i.qty;
            if (i.cost > 0) p.cost = i.cost; // update latest cost
          }
        });
        audit('purchase_create', `${supplier} • ${items.length} items • ${fmtNPR(total)}`);
        Store.save();
        toast('Stock received', 'success');
        goto('purchases');
      };

      function redrawLines() {
        const container = $('#pu-lines');

        container.innerHTML = lines.map((l, i) => `
      <div class="border border-stone-200 rounded-xl p-2.5">
        <div class="flex gap-2 items-center mb-2">
          <select onchange="updateLine(${i},'productId',this.value)" class="flex-1 border border-stone-200 rounded-lg px-2 py-2 text-sm bg-white">
            <option value="">Choose product</option>
            ${state.products.map(p => `<option value="${p.id}" ${l.productId === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
          </select>
          <button onclick="removePuLine(${i})" class="text-red-500 p-1">${ICON.trash}</button>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] uppercase text-stone-500 font-semibold">Qty</label>
            <input type="number" inputmode="numeric" value="${l.qty}" oninput="updateLine(${i},'qty',this.value)" class="w-full border border-stone-200 rounded-lg px-2 py-2 text-sm" />
          </div>
          <div>
            <label class="text-[10px] uppercase text-stone-500 font-semibold">Cost / unit</label>
            <input type="number" inputmode="decimal" value="${l.cost}" oninput="updateLine(${i},'cost',this.value)" class="w-full border border-stone-200 rounded-lg px-2 py-2 text-sm" placeholder="NPR" />
          </div>
        </div>
        <div class="text-[11px] text-stone-500 text-right mt-1.5">Subtotal: <strong>${fmtNPR((Number(l.qty) || 0) * (Number(l.cost) || 0))}</strong></div>
      </div>
    `).join('');
        const total = lines.reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.cost) || 0), 0);
        $('#pu-total').textContent = fmtNPR(total);
      }
      window.updateLine = (i, field, val) => {
        lines[i][field] = field === 'productId' ? val : Number(val);
        if (field === 'productId') {
          const p = state.products.find(p => p.id === val);
          if (p && !lines[i].cost) lines[i].cost = p.cost;
        }
        redrawLines();
      };
    }

           </div>

             <input id="sa-cost" type="number" inputmode="decimal" value="${p.cost}" class="w-full border border-stone-200 rounded-xl px-3 py-3 ring-brand text-sm" />
           </div>
        </div>
        <div class="flex gap-2">
          <button onclick="$('#modal-root').innerHTML=''" class="flex-1 py-3.5 rounded-xl border border-stone-200 font-semibold text-stone-600">Cancel</button>
          <button onclick="confirmStockAdd('${p.id}')" class="flex-1 py-3.5 rounded-xl brand-grad text-white font-bold">Update Stock</button>
        </div>
      </div>
    </div>`;
        setTimeout(() => { $('#sa-qty').focus(); }, 300);
      } else {
        // Doesn't exist
        showProductNotFound(code);
      }

    function confirmStockAdd(pid) {
      const qty = Number($('#sa-qty').value) || 0;
      const cost = Number($('#sa-cost').value) || 0;
      if (qty <= 0) { toast('Enter a valid quantity', 'error'); return; }
      const p = state.products.find(x => x.id === pid);
      if (p) {
        p.stock += qty;
        if (cost > 0) p.cost = cost;

        // Create stock received record (Purchase)
        const purchase = {
          id: uid('pu'),
          supplier: 'Direct Add',
          bill: '-',
          items: [{ productId: p.id, name: p.name, qty, cost: cost || p.cost }],
          total: qty * (cost || p.cost),
          ts: nowISO(),
          user: session.name
        };
        state.purchases.push(purchase);

        audit('purchase_create', `Direct Add: ${p.name} (+${qty})`);
        Store.save();
        toast(`Added ${qty} to ${p.name}`, 'success');
      }
      $('#modal-root').innerHTML = '';
    }

      state.shop.name = $('#se-name').value.trim();
      state.shop.address = $('#se-addr').value.trim();
      state.shop.phone = $('#se-phone').value.trim();
      state.shop.vat = $('#se-vat').value.trim();
      state.settings.taxRate = Number($('#se-tax').value) || 0;
      state.settings.qrPaymentLabel = $('#se-qr').value.trim();
      state.settings.lowStockThreshold = Number($('#se-low').value) || 5;
      audit('settings_update', 'Shop settings updated');
      Store.save();
      toast('Settings saved', 'success');
      goto('more');
    }

    function resetDemo() {
      if (!confirm('Reset all data? This cannot be undone.')) return;
      Store.reset();
      state = Store.load();
      setCart([]);
      toast('Demo reset', 'info');
      goto('home');
    }

    /* ====================================================================
       BOOT
       ==================================================================== */
    document.addEventListener('DOMContentLoaded', () => { render(); });
  </script>
</body>

</html>
